<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android CI Build Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f23;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 30% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            pointer-events: none;
            animation: backgroundShift 20s ease infinite;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            opacity: 0.3;
        }

        @keyframes backgroundShift {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            color: white;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .header .tagline {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
            font-weight: 300;
            font-style: italic;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(99, 102, 241, 0.4);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
        }

        .builds-container {
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease 0.5s both;
        }

        .chart-header {
            margin-bottom: 25px;
        }

        .chart-header h2 {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .chart-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .chart {
            position: relative;
            height: 350px;
            padding: 20px 10px 60px 60px;
        }

        .chart-y-axis {
            position: absolute;
            left: 0;
            top: 20px;
            bottom: 60px;
            width: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            padding-right: 10px;
            border-right: 2px solid rgba(255, 255, 255, 0.2);
        }

        .chart-y-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .chart-grid {
            position: absolute;
            left: 60px;
            right: 10px;
            top: 20px;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .chart-grid-line {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .chart-bars-container {
            position: absolute;
            left: 60px;
            right: 10px;
            top: 20px;
            bottom: 60px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 8px;
        }

        .chart-bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100px;
            position: relative;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            min-width: 40px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px 8px 0 0;
            position: relative;
            transition: all 0.3s ease;
            animation: barGrow 0.8s ease backwards;
            box-shadow: 0 -4px 20px rgba(102, 126, 234, 0.3);
        }

        .chart-bar:hover {
            filter: brightness(1.2);
            box-shadow: 0 -6px 30px rgba(102, 126, 234, 0.5);
        }

        .chart-bar.success {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            box-shadow: 0 -4px 20px rgba(16, 185, 129, 0.3);
        }

        .chart-bar.success:hover {
            box-shadow: 0 -6px 30px rgba(16, 185, 129, 0.5);
        }

        .chart-bar.failure {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 -4px 20px rgba(239, 68, 68, 0.3);
        }

        .chart-bar.failure:hover {
            box-shadow: 0 -6px 30px rgba(239, 68, 68, 0.5);
        }

        .chart-value {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .chart-label {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-weight: 600;
            white-space: nowrap;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-color.success {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .legend-color.failure {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .build-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.5s ease backwards;
        }

        .build-card:hover {
            transform: translateX(10px);
            box-shadow: 0 15px 50px rgba(99, 102, 241, 0.4);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .build-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            transition: width 0.3s ease;
        }

        .build-card.success::before {
            background: linear-gradient(180deg, #10b981, #059669);
        }

        .build-card.failure::before {
            background: linear-gradient(180deg, #ef4444, #dc2626);
        }

        .build-card:hover::before {
            width: 12px;
        }

        .build-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .commit-hash {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background: rgba(99, 102, 241, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .status-badge {
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .status-badge.success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .status-badge.failure {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .build-details {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        .detail-item strong {
            color: #fff;
        }

        .view-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .view-link:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }

        .gemini-insight {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 193, 7, 0.15));
            border-left: 4px solid #ffc107;
            border-radius: 10px;
            color: #fff;
            line-height: 1.8;
            position: relative;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .gemini-insight::before {
            content: '✨ AI Insight:';
            display: block;
            font-weight: 700;
            color: #ff9800;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gemini-content {
            position: relative;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .gemini-content.collapsed {
            max-height: 150px;
        }

        .gemini-content.collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(to bottom, transparent, rgba(30, 30, 50, 0.95));
            pointer-events: none;
        }

        .gemini-content p {
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.9);
        }

        .gemini-content h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #fbbf24;
            margin: 20px 0 10px 0;
        }

        .gemini-content h3:first-child {
            margin-top: 0;
        }

        .gemini-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.3);
        }

        .gemini-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gemini-content pre code {
            background: none;
            padding: 0;
            border: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85em;
        }

        .gemini-content ul, .gemini-content ol {
            margin: 10px 0;
            padding-left: 25px;
        }

        .gemini-content li {
            margin-bottom: 8px;
        }

        .gemini-content strong {
            color: #ff9800;
            font-weight: 600;
        }

        .expand-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        .expand-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 152, 0, 0.6);
        }

        .expand-btn:active {
            transform: scale(0.98);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
        }

        .loading::after {
            content: '';
            display: block;
            width: 50px;
            height: 50px;
            margin: 20px auto;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-weight: 600;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes barGrow {
            from {
                transform: scaleY(0);
                opacity: 0;
            }
            to {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .build-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .build-details {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>⚡ BuildPulse</h1>
            <p class="subtitle">Intelligent CI/CD Analytics</p>
            <p class="tagline">Monitor, analyze, and optimize your Android builds in real-time</p>
        </div>

        <div class="stats-grid" id="stats">
            <!-- Stats will be injected here -->
        </div>

        <div class="chart-container" id="chartContainer">
            <!-- Chart will be injected here -->
        </div>

        <div class="builds-container" id="builds">
            <div class="loading">Loading builds...</div>
        </div>
    </div>

    <script>
        // Environment variable for server URL - defaults to localhost if not set
       const SERVER_URL =
  window.ENV_SERVER_URL ||
  `${window.location.protocol}//api.chaitanyadev.in`;


        const buildsContainer = document.getElementById('builds');
        const statsContainer = document.getElementById('stats');
        const chartContainer = document.getElementById('chartContainer');

        function calculateStats(builds) {
            const total = builds.length;
            const successful = builds.filter(b => b.status === 'success').length;
            const failed = builds.filter(b => b.status === 'failure').length;
            const avgDuration = builds.length > 0 
                ? (builds.reduce((sum, b) => sum + (b.duration || 0), 0) / builds.length).toFixed(1)
                : 0;

            return { total, successful, failed, avgDuration };
        }

        function renderChart(builds) {
            if (builds.length === 0) return;

            // Get last 10 builds for the chart
            const chartBuilds = builds.slice(0, 10).reverse();
            const durations = chartBuilds.map(b => b.duration || 0);
            const maxDuration = Math.max(...durations);
            
            // Add 10% padding to max for better visibility
            const chartMax = Math.ceil(maxDuration * 1.1);

            // Create Y-axis labels (0 to max duration)
            const yAxisSteps = 5;
            const yAxisLabels = [];
            for (let i = 0; i <= yAxisSteps; i++) {
                yAxisLabels.push(Math.round((chartMax / yAxisSteps) * i));
            }

            const yAxisHtml = yAxisLabels.reverse().map(label => 
                `<div class="chart-y-label">${label}s</div>`
            ).join('');

            const gridLinesHtml = Array(yAxisSteps + 1).fill(0).map(() => 
                '<div class="chart-grid-line"></div>'
            ).join('');

            const barsHtml = chartBuilds.map((build, index) => {
                const duration = build.duration || 0;
                // Calculate height as percentage of chartMax (not maxDuration)
                const heightPercent = chartMax > 0 ? (duration / chartMax) * 100 : 0;
                const commitShort = build.commit.substring(0, 7);
                
                return `
                    <div class="chart-bar-container" style="animation-delay: ${index * 0.1}s">
                        <div class="chart-bar ${build.status}" 
                             style="height: ${heightPercent}%"
                             title="${build.commit} - ${duration}s">
                            <div class="chart-value">${duration}s</div>
                        </div>
                        <div class="chart-label" title="${build.commit}">${commitShort}</div>
                    </div>
                `;
            }).join('');

            chartContainer.innerHTML = `
                <div class="chart-header">
                    <h2>📊 Build Performance Timeline</h2>
                    <p>Duration analysis for the last ${chartBuilds.length} builds</p>
                </div>
                <div class="chart">
                    <div class="chart-y-axis">
                        ${yAxisHtml}
                    </div>
                    <div class="chart-grid">
                        ${gridLinesHtml}
                    </div>
                    <div class="chart-bars-container">
                        ${barsHtml}
                    </div>
                </div>
                <div class="chart-legend">
                    <div class="legend-item">
                        <div class="legend-color success"></div>
                        <span>Successful Build</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color failure"></div>
                        <span>Failed Build</span>
                    </div>
                </div>
            `;
        }

        function renderStats(stats) {
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <h3>Total Builds</h3>
                    <div class="value">${stats.total}</div>
                </div>
                <div class="stat-card">
                    <h3>Successful</h3>
                    <div class="value" style="color: #10b981;">${stats.successful}</div>
                </div>
                <div class="stat-card">
                    <h3>Failed</h3>
                    <div class="value" style="color: #ef4444;">${stats.failed}</div>
                </div>
                <div class="stat-card">
                    <h3>Avg Duration</h3>
                    <div class="value">${stats.avgDuration}s</div>
                </div>
            `;
        }

        function parseGeminiContent(text) {
            if (!text) return '';

            // Split by lines
            let lines = text.split('\n');
            let html = '';
            let inCodeBlock = false;
            let codeLines = [];

            for (let line of lines) {
                line = line.trim();
                if (!line) {
                    if (!inCodeBlock) html += '<p>&nbsp;</p>';
                    continue;
                }

                // Check for code block markers
                if (line.startsWith('```')) {
                    if (inCodeBlock) {
                        // End code block
                        html += '<pre><code>' + codeLines.join('\n') + '</code></pre>';
                        codeLines = [];
                        inCodeBlock = false;
                    } else {
                        // Start code block
                        inCodeBlock = true;
                    }
                    continue;
                }

                if (inCodeBlock) {
                    codeLines.push(escapeHtml(line));
                    continue;
                }

                // Check if line is a heading (text between ** **)
                if (line.startsWith('**') && line.endsWith('**')) {
                    const heading = line.slice(2, -2);
                    html += `<h3>${escapeHtml(heading)}</h3>`;
                    continue;
                }

                // Handle inline formatting
                line = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                line = line.replace(/`(.*?)`/g, '<code>$1</code>');

                // Check for list items
                if (line.startsWith('- ') || line.startsWith('* ')) {
                    html += `<ul><li>${line.slice(2)}</li></ul>`;
                } else if (/^\d+\.\s/.test(line)) {
                    html += `<ol><li>${line.replace(/^\d+\.\s/, '')}</li></ol>`;
                } else {
                    html += `<p>${line}</p>`;
                }
            }

            // Close any open code block
            if (inCodeBlock) {
                html += '<pre><code>' + codeLines.join('\n') + '</code></pre>';
            }

            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderBuilds(builds) {
            if (builds.length === 0) {
                buildsContainer.innerHTML = '<div class="error">No builds found</div>';
                return;
            }

            buildsContainer.innerHTML = builds.map((run, index) => {
                const geminiHtml = run.gemini ? parseGeminiContent(run.gemini) : '';
                const insightId = `insight-${index}`;
                
                return `
                    <div class="build-card ${run.status}" style="animation-delay: ${index * 0.1}s">
                        <div class="build-header">
                            <div class="commit-hash">${run.commit}</div>
                            <span class="status-badge ${run.status}">${run.status}</span>
                        </div>
                        <div class="build-details">
                            <div class="detail-item">
                                <span>⏱️</span>
                                <span><strong>Duration:</strong> ${run.duration}s</span>
                            </div>
                            <a href="${run.url}" target="_blank" class="view-link">
                                View Details →
                            </a>
                        </div>
                        ${geminiHtml ? `
                            <div class="gemini-insight">
                                <div class="gemini-content collapsed" id="${insightId}">
                                    ${geminiHtml}
                                </div>
                                <button class="expand-btn" onclick="toggleInsight('${insightId}', this)">
                                    Show More ↓
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function toggleInsight(id, button) {
            const content = document.getElementById(id);
            const isCollapsed = content.classList.contains('collapsed');
            
            if (isCollapsed) {
                content.classList.remove('collapsed');
                content.style.maxHeight = content.scrollHeight + 'px';
                button.textContent = 'Show Less ↑';
            } else {
                content.classList.add('collapsed');
                content.style.maxHeight = '150px';
                button.textContent = 'Show More ↓';
            }
        }

        // Fetch and render builds
        fetch(`${SERVER_URL}/builds`)
            .then(res => {
                if (!res.ok) throw new Error('Failed to fetch builds');
                return res.json();
            })
            .then(data => {
                const stats = calculateStats(data);
                renderStats(stats);
                renderChart(data);
                renderBuilds(data);
            })
            .catch(error => {
                console.error('Error:', error);
                buildsContainer.innerHTML = `
                    <div class="error">
                        ❌ Failed to load builds. Please check if the server is running at ${SERVER_URL}
                    </div>
                `;
            });
    </script>
</body>

</html>
